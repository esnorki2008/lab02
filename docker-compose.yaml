# NovaMercado — producto completo:  cp .env.example .env  &&  docker compose up -d --build
#   API ........ http://localhost:8000/docs
#   MLflow ..... http://localhost:5000
#   Airflow .... http://localhost:8080   (usuario/clave: AIRFLOW_ADMIN_USER / AIRFLOW_ADMIN_PASSWORD de .env)
name: novamercado

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  image: novamercado-airflow:1.0.0
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:?Copie .env.example a .env}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    # base de datos del PRODUCTO (distinta de la de Airflow) y servicios que usa el DAG
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    NOVAMERCADO_API_URL: http://api:8000
  volumes:
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ base de datos del producto
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copie .env.example a .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------------ MLflow (tracking + registry)
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: novamercado-mlflow:2.19.0
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------ arranque: datos + primer modelo
  arranque:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: novamercado-api:1.0.0
    command: ["python", "-m", "novamercado.arranque"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      NOVAMERCADO_DATA_DIR: /app/raw_data
    volumes:
      - ./raw_data:/app/raw_data:ro
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: on-failure:5

  # ------------------------------------------------------------------ API
  api:
    image: novamercado-api:1.0.0
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AIRFLOW_URL: http://airflow-apiserver:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    volumes:
      - api-cache:/app/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ Airflow 3 (con su propia base de datos)
  airflow-db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?Copie .env.example a .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate && airflow version"]
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        printf '{"%s": "%s"}' "$$AIRFLOW_ADMIN_USER" "$$AIRFLOW_ADMIN_PASSWORD"
        > /opt/airflow/simple_auth_passwords.json && exec airflow api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  db-data:
  mlflow-data:
  api-cache:
  airflow-db-data:
  airflow-logs:
